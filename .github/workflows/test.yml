name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        # The checker uses PyYAML + jsonschema; the test layers use
        # pytest. setup-python ships a fresh interpreter on self-hosted
        # runners; the dependencies are not preinstalled.
        run: pip install --quiet pytest pyyaml jsonschema
      - run: bash tests/run-all.sh
