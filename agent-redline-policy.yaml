# agent-redline policy for rore/agent-workflow.
#
# This repo IS the source of the agent-workflow + agent-redline skill —
# the "dev repo" in slice-B terminology. The skill ships from here via
# dist/agent-workflow/ and is consumed by other repos.
#
# Zone-only shape (per the python extension's profile.md): no
# pyproject.toml, no [tool.importlinter], no JVM build. There's no
# boundary-rule backend to mirror, and we don't fabricate one. The
# checker runs in-process via `python -m core.checker`, not via a
# vendored single-file script.
#
# Calibration (bootstrap, against 18 merged PRs):
#   agent-redline-policy.yaml             0%   (file did not exist yet)
#   agent-workflow.yaml                  27%
#   core/schema/**                        5%
#   core/agent-redline/core/schema/**     5%
#   docs/SPEC.md                          5%
#   .github/workflows/agent-workflow.yml 16%
# No demotions (none above the 70% over-fire threshold). Re-run the
# tuner during shadow Window 1 (4 weeks / 30 PRs from this commit)
# and revisit thresholds + zones.

version: 1

project:
  name: agent-workflow
  # No `extension:` — zone-only shape.

zones:
  red:
    # Self-protection: the policy must classify itself red or an agent
    # could weaken it silently (per redline bootstrap §"Hard rules").
    - path: "agent-redline-policy.yaml"
      reason: governance source of truth
      checkpoint: architecture-review

    # Self-protection: agent-workflow's per-repo config.
    - path: "agent-workflow.yaml"
      reason: agent-workflow per-repo config (backend selection, redline integration)
      checkpoint: architecture-review

    # JSON schemas every consuming install validates against —
    # cross-install contract.
    - path: "core/schema/**"
      reason: agent-workflow JSON schemas — cross-install contract
      checkpoint: architecture-review

    - path: "core/agent-redline/core/schema/**"
      reason: agent-redline JSON schemas — cross-install contract
      checkpoint: architecture-review

    # AGENTS.md: "The spec is normative. For any conceptual change:
    # edit docs/SPEC.md first."
    - path: "docs/SPEC.md"
      reason: normative spec for the whole system
      checkpoint: architecture-review

    # The CI workflow is the gate itself — bypass it, bypass everything.
    - path: ".github/workflows/agent-workflow.yml"
      reason: CI gate workflow — changes affect every PR's merge criteria
      checkpoint: architecture-review

  watch:
    - path: "core/**"
      reason: harness implementation (checker, work-record, redline reporter)
    - path: ".claude/skills/agent-workflow/**"
      reason: agent-workflow skill source files
    - path: "core/agent-redline/.claude/skills/agent-redline/**"
      reason: agent-redline skill source files
    - path: "core/templates/**"
      reason: work-record + agents-section templates
    - path: "core/agent-redline/assets/templates/**"
      reason: redline-side templates
    - path: "docs/DECISIONS.md"
      reason: append-only decision log (architectural decisions)
    # Hand-edits to suppressions bypass redline's discipline. The
    # schema says "do not relocate"; vendored from the extension at
    # bootstrap. Surface changes so a reviewer can confirm the change
    # is intentional and matches an extension update — not red because
    # legitimate updates do happen.
    - path: ".agent-redline/suppressions.yaml"
      reason: vendored suppression markers (machine-managed; reporter reads from fixed path)
    # AGENTS.md is the orientation doc for agents working on this repo.
    # Not architectural, but worth surfacing — changes ship to every
    # session that loads the file.
    - path: "AGENTS.md"
      reason: agent-instruction surface (loaded by every session)
    # Skill install source — regenerated by scripts/install-skill-locally.sh.
    # Surfaced so a reviewer can confirm the regen ran on a source change;
    # not red because every legitimate skill edit lands here.
    - path: "dist/agent-workflow/**"
      reason: skill install source (regenerated artifact)

  blue:
    - path: "tests/**"
      reason: tests
    - path: "docs/**"
      reason: documentation (SPEC.md handled above under red)
    - path: "scripts/**"
      reason: local tooling
    - path: ".agent-workflow/tasks/**"
      reason: Work Records — per-task records, validated by the checker
    - path: "**/README.md"
      reason: READMEs
    - path: "**/CONTRIBUTING.md"
      reason: contributing notes

# Zone-only: no boundary-rule backend. The reporter skips boundary parsing.
boundaryAdapter:
  outputFormat: none

# No public API contract surface — the install surface is JSON Schemas,
# already classified red above.
api:
  type: none

# PR-size thresholds — defaults from the python extension's zone-only
# fallback (profile.md "Default PR-size thresholds"). Median PR is 6
# files / 492 lines; p75 is 38 / 1352. The thresholds will warn on
# ~25% of recent PRs, which is the right signal to surface during
# shadow before deciding whether to adjust.
prRules:
  maxChangedFiles:
    warn: 30
    fail: 80
  maxLinesChanged:
    warn: 800
    fail: 1500

checkpoints:
  architecture-review:
    description: Architecture review for structural / governance changes
    satisfiedBy:
      - codeownerApproval
      - label: architecture-reviewed

modes:
  default: shadow                # 4 weeks / 30 PRs of shadow before flipping
  perCheck:
    boundary_violation: binding  # non-waivable per SPEC; explicit for clarity

suppressions:
  useExtensionDefaults: true
  exemptPaths:
    - "**/tests/**"
    - "**/fixtures/**"
